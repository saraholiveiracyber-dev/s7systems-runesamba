
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <title>Run & Samba | 2ª Edição 2026</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #050505;
            font-family: Arial, Helvetica, sans-serif;
        }

        .intro {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 24px;
        }

        .logo {
            display: block;
            width: min(72vw, 320px);
            height: auto;
            object-fit: contain;
            opacity: 0;
            transform: translateY(18px) scale(.92);
            animation: avancar 1.5s cubic-bezier(.2, .75, .25, 1) .1s forwards;
        }

        .evento {
            margin-top: 24px;
            color: #f5c400;
            font-size: clamp(13px, 3.5vw, 17px);
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(10px);
            animation: revelar .8s ease-out .8s forwards;
        }

        .edicao {
            margin-top: 10px;
            color: #858585;
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0;
            animation: revelar .8s ease-out 1.1s forwards;
        }

        .linha {
            width: 100px;
            height: 2px;
            margin-top: 27px;
            background: #252525;
            overflow: hidden;
            opacity: 0;
            animation: revelar .4s ease-out 1s forwards;
        }

        .linha span {
            display: block;
            width: 100%;
            height: 100%;
            background: #f5c400;
            transform: translateX(-100%);
            animation: carregar 2s linear forwards;
        }

        @keyframes avancar {
            0% {
                opacity: 0;
                transform: translateY(18px) scale(.92);
                filter: drop-shadow(0 0 0 rgba(245, 196, 0, 0));
            }
            65% {
                opacity: 1;
                transform: translateY(0) scale(1.04);
                filter: drop-shadow(0 0 22px rgba(245, 196, 0, .12));
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: drop-shadow(0 0 12px rgba(245, 196, 0, .06));
            }
        }

        @keyframes revelar {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes carregar {
            to {
                transform: translateX(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo, .evento, .edicao, .linha {
                animation-duration: .01ms;
                animation-delay: 0s;
                animation-fill-mode: forwards;
            }
        }
    </style>
</head>

<body>
    <main class="intro">
        <img
            class="logo"
            src="img/logo.png"
            alt="Run & Samba"
        >

        <h1 class="evento">Run & Samba</h1>
        <p class="edicao">2ª Edição · 2026</p>

        <div class="linha" aria-hidden="true">
            <span></span>
        </div>
    </main>

    <script>
        setTimeout(() => {
            window.location.replace("inscricoes.html");
        }, 3000);
    </script>
</body>
</html>
